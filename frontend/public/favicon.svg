<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded Dark Background -->
  <rect width="100" height="100" rx="20" fill="#0f172a"/>
  
  <!-- Outer Speech/Soundwave Circle Accent -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.3"/>
  
  <!-- "Emmycoder" Monogram Group -->
  <g transform="translate(50, 50)">
    <!-- 'E' (Emmy) -->
    <path d="M-22,-14 L2,-14 M-22,-14 L-22,14 M-22,14 L2,14 M-22,0 L-6,0" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- 'C' (coder) -->
    <path d="M22,-8 A12,12 0 1,0 22,8" 
          fill="none" 
          stroke="#818cf8" 
          stroke-width="5" 
          stroke-linecap="round"/>
          
    <!-- Sound/Voice Accent Dot -->
    <circle cx="2" cy="14" r="3.5" fill="#38bdf8"/>
  </g>
</svg>
